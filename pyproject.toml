[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monitor-agent-ai"
version = "0.1.0"
description = "AI agent that automatically sets up monitoring alerts, dashboards, and runbooks from your app config."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = []
keywords = ["monitoring", "observability", "prometheus", "grafana", "ai", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
monitor-agent = "monitor_agent.cli:main"

[project.urls]
Homepage = "https://github.com/example/monitor-agent-ai"
Repository = "https://github.com/example/monitor-agent-ai"

[tool.hatch.build.targets.wheel]
packages = ["monitor_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
